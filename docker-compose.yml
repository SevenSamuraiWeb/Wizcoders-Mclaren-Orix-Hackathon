version: '3.8'

services:
  backend:
    build: 
      context: ./mss-backend
      dockerfile: Dockerfile
    container_name: mss-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MSS Financial Analysis API
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost"]
      - JWT_SECRET=super-secure-secret-key-for-production-deployment-12345
      # Add other environment variables here as needed
    restart: unless-stopped
    networks:
      - mss-network

  frontend:
    build: 
      context: ./mss-frontend
      dockerfile: Dockerfile
    container_name: mss-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mss-network

networks:
  mss-network:
    driver: bridge
