name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mss-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mss-frontend/**'

jobs:
  # ========================================================================
  # Linting & Code Quality
  # ========================================================================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mss-frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd mss-frontend
          npm ci

      - name: Run ESLint
        run: |
          cd mss-frontend
          npm run lint

  # ========================================================================
  # Build
  # ========================================================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mss-frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd mss-frontend
          npm ci

      - name: Build application
        run: |
          cd mss-frontend
          npm run build

      - name: Verify build artifacts
        run: |
          ls -la mss-frontend/dist/
          [ -f mss-frontend/dist/index.html ] && echo "✅ Build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: mss-frontend/dist/
          retention-days: 7

  # ========================================================================
  # Success Notification
  # ========================================================================
  success:
    name: Pipeline Success
    runs-on: ubuntu-latest
    needs: [ lint, build ]
    if: success()
    steps:
      - name: Notify success
        run: echo "✅ Frontend CI/CD pipeline passed!"
